<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>මගේ වියදම්</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#0E7C66">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="මගේ වියදම්">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1 class="brand"><img src="logo.svg" alt="" width="40" height="40"><span>මගේ වියදම් <small id="today"></small></span></h1>
  <div style="display:flex;gap:8px"><button class="ib" id="lang" style="font-weight:700;font-size:13px;font-family:inherit">EN</button><button class="ib" id="theme" aria-label="Theme">🌙</button></div>
</header>
<main>
  <div class="seg" id="accs"></div>
  <section class="view on" id="v-home">
    <div class="card bal">
      <div class="l">මෙම මාසයේ ශේෂය</div>
      <div class="n" id="hBal">Rs. 0</div>
      <div class="row"><div>ආදායම<b id="hIn">0</b></div><div>වියදම<b id="hEx">0</b></div></div>
    </div>
    <h2>මෑත ගනුදෙනු</h2>
    <div class="card" id="hList"></div>
  </section>

  <section class="view" id="v-add">
    <div class="seg"><button class="on" data-t="e">වියදම</button><button data-t="i">ආදායම</button></div>
    <div class="card">
      <label for="aAmt">මුදල (Rs.)</label>
      <input id="aAmt" class="big" type="number" inputmode="decimal" placeholder="0.00" min="0">
      <label>වර්ගය</label>
      <div class="cats" id="aCats"></div>
      <label for="aNote">සටහන</label>
      <input id="aNote" type="text" placeholder="උදා: දවල් කෑම">
      <label for="aDate">දිනය</label>
      <input id="aDate" type="date">
      <button class="btn" id="aSave">සුරකින්න</button>
    </div>
  </section>

  <section class="view" id="v-hist">
    <div class="mo"><button class="ib" data-m="-1">‹</button><b id="mLbl"></b><button class="ib" data-m="1">›</button></div>
    <div class="card" id="mList"></div>
  </section>

  <section class="view" id="v-stat">
    <div class="mo"><button class="ib" data-m="-1">‹</button><b id="sLbl"></b><button class="ib" data-m="1">›</button></div>
    <div class="card"><b>වර්ග අනුව වියදම</b><div id="sBars"></div></div>
    <h2>දත්ත</h2>
    <button class="btn g" id="exp">දත්ත උපස්ථ කරන්න (බාගත)</button>
    <button class="btn g" id="impB">උපස්ථයෙන් ආපසු ගන්න</button>
    <input type="file" id="imp" accept=".json" hidden>
    <button class="btn d" id="clr">සියලු දත්ත මකන්න</button>
  </section>
</main>
<nav>
  <button class="on" data-v="home"><i>🏠</i>මුල</button>
  <button data-v="hist"><i>🧾</i>ඉතිහාසය</button>
  <button class="add" data-v="add"><i>＋</i>එක් කරන්න</button>
  <button data-v="stat"><i>📊</i>සාරාංශ</button>
</nav>
<div id="toast"></div>
<script src="script.js"></script>
</body>
</html>
